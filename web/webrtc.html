<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drone Live WebRTC Stream</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0e14;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      padding: 10px 20px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      z-index: 10;
    }
    .status-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 500;
      background: #21262d;
      border: 1px solid #30363d;
    }
    .badge strong { color: #58a6ff; }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #f85149;
    }
    .dot.connected { background: #3fb950; box-shadow: 0 0 8px #3fb950; }
    .dot.connecting { background: #d29922; }
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    input {
      background: #0d1117;
      border: 1px solid #30363d;
      color: #e6edf3;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      width: 140px;
    }
    button {
      background: #238636;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #2ea043; }
    button.disconnect { background: #da3633; }
    button.disconnect:hover { background: #f85149; }
    #video-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      position: relative;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    .hud {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(13, 17, 23, 0.8);
      backdrop-filter: blur(6px);
      padding: 10px 16px;
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 13px;
      color: #39d353;
      border: 1px solid rgba(255, 255, 255, 0.1);
      pointer-events: none;
      line-height: 1.5;
    }
    .hud-sub {
      color: #8b949e;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <div class="status-group">
      <div class="badge">
        <span id="status-dot" class="dot"></span>
        <span id="status-text">Disconnected</span>
      </div>
      <div class="badge">Protocol: <strong>WebRTC (UDP)</strong></div>
      <div class="badge">FPS: <strong id="fps-val">0.0</strong></div>
      <div class="badge">Bitrate: <strong id="bitrate-val">-</strong></div>
      <div class="badge">Res: <strong id="res-val">-</strong></div>
    </div>
    <div class="controls">
      <input type="text" id="server-host" value="172.21.35.248" placeholder="Pi IP Address" />
      <input type="number" id="server-port" value="8080" placeholder="Port" style="width: 80px;" />
      <button id="btn-toggle">Connect</button>
      <button id="btn-fullscreen" style="background:#30363d;">Fullscreen</button>
    </div>
  </header>

  <div id="video-container">
    <video id="remoteVideo" autoplay playsinline muted></video>
    <div class="hud" id="hud-overlay">
      <div>Status: <span id="hud-status" style="color:#e6edf3;">Idle</span></div>
      <div class="hud-sub" id="hud-details">Enter IP and click Connect</div>
    </div>
  </div>

  <script>
    const video = document.getElementById("remoteVideo");
    const statusDot = document.getElementById("status-dot");
    const statusText = document.getElementById("status-text");
    const fpsVal = document.getElementById("fps-val");
    const bitrateVal = document.getElementById("bitrate-val");
    const resVal = document.getElementById("res-val");
    const hudStatus = document.getElementById("hud-status");
    const hudDetails = document.getElementById("hud-details");
    const btnToggle = document.getElementById("btn-toggle");
    const btnFullscreen = document.getElementById("btn-fullscreen");
    const inputHost = document.getElementById("server-host");
    const inputPort = document.getElementById("server-port");

    let pc = null;
    let statsInterval = null;
    let bytesPrev = 0;
    let timestampPrev = 0;

    // Automatically set host/port if served by server_webrtc.py
    if (window.location.hostname && window.location.hostname !== "localhost" && window.location.hostname !== "127.0.0.1") {
      inputHost.value = window.location.hostname;
    }
    if (window.location.port) {
      inputPort.value = window.location.port;
    }

    async function startWebRTC() {
      const host = inputHost.value.trim();
      const port = inputPort.value.trim();
      const offerUrl = `http://${host}:${port}/offer`;

      statusText.textContent = "Connecting...";
      statusDot.className = "dot connecting";
      hudStatus.textContent = "Negotiating WebRTC SDP...";
      btnToggle.textContent = "Connecting...";

      try {
        pc = new RTCPeerConnection({
          iceServers: [
            { urls: "stun:stun.l.google.com:19302" }
          ]
        });

        pc.addEventListener("track", (event) => {
          if (event.track.kind === "video") {
            video.srcObject = event.streams[0];
            hudStatus.textContent = "Receiving WebRTC Video Track";
          }
        });

        pc.addEventListener("connectionstatechange", () => {
          console.log("Connection State:", pc.connectionState);
          if (pc.connectionState === "connected") {
            statusText.textContent = "Live";
            statusDot.className = "dot connected";
            btnToggle.textContent = "Disconnect";
            btnToggle.className = "disconnect";
            hudStatus.textContent = "Live Stream (WebRTC UDP)";
            startStatsMonitor();
          } else if (pc.connectionState === "disconnected" || pc.connectionState === "failed") {
            stopWebRTC();
          }
        });

        // Request receive-only video transceiver
        pc.addTransceiver("video", { direction: "recvonly" });

        // Create SDP offer
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        // Wait for ICE candidate gathering (Vanilla ICE single-roundtrip)
        await new Promise((resolve) => {
          if (pc.iceGatheringState === "complete") {
            resolve();
          } else {
            const checkState = () => {
              if (pc.iceGatheringState === "complete") {
                pc.removeEventListener("icegatheringstatechange", checkState);
                resolve();
              }
            };
            pc.addEventListener("icegatheringstatechange", checkState);
          }
        });

        // Send offer to server
        const response = await fetch(offerUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            sdp: pc.localDescription.sdp,
            type: pc.localDescription.type,
          }),
        });

        if (!response.ok) {
          throw new Error(`HTTP error ${response.status}`);
        }

        const answer = await response.json();
        await pc.setRemoteDescription(new RTCSessionDescription(answer));

      } catch (err) {
        console.error("WebRTC Error:", err);
        hudStatus.textContent = `Connection Failed: ${err.message}`;
        stopWebRTC();
      }
    }

    function startStatsMonitor() {
      if (statsInterval) clearInterval(statsInterval);
      bytesPrev = 0;
      timestampPrev = performance.now();

      statsInterval = setInterval(async () => {
        if (!pc) return;
        const stats = await pc.getStats();

        stats.forEach((report) => {
          if (report.type === "inbound-rtp" && report.kind === "video") {
            const now = report.timestamp;
            const bytes = report.bytesReceived;

            if (timestampPrev > 0 && bytesPrev > 0) {
              const bitrate = (8 * (bytes - bytesPrev)) / (now - timestampPrev); // kbps
              bitrateVal.textContent = bitrate > 1000 ? `${(bitrate / 1000).toFixed(2)} Mbps` : `${bitrate.toFixed(0)} kbps`;
            }
            bytesPrev = bytes;
            timestampPrev = now;

            if (report.framesPerSecond !== undefined) {
              fpsVal.textContent = report.framesPerSecond.toFixed(1);
            }
            if (report.frameWidth && report.frameHeight) {
              resVal.textContent = `${report.frameWidth}x${report.frameHeight}`;
            }

            const packetsLost = report.packetsLost || 0;
            const jitterMs = report.jitter ? (report.jitter * 1000).toFixed(1) : 0;
            hudDetails.textContent = `Resolution: ${video.videoWidth}x${video.videoHeight} | Lost Pkts: ${packetsLost} | Jitter: ${jitterMs}ms`;
          }
        });
      }, 1000);
    }

    function stopWebRTC() {
      if (statsInterval) {
        clearInterval(statsInterval);
        statsInterval = null;
      }
      if (pc) {
        pc.close();
        pc = null;
      }
      statusText.textContent = "Disconnected";
      statusDot.className = "dot";
      btnToggle.textContent = "Connect";
      btnToggle.className = "";
      fpsVal.textContent = "0.0";
      bitrateVal.textContent = "-";
      video.srcObject = null;
    }

    btnToggle.addEventListener("click", () => {
      if (pc) stopWebRTC();
      else startWebRTC();
    });

    btnFullscreen.addEventListener("click", () => {
      if (!document.fullscreenElement) {
        document.getElementById("video-container").requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    });

    // Auto-connect if page is served from the Raspberry Pi
    window.addEventListener("load", () => {
      if (window.location.protocol.startsWith("http")) {
        startWebRTC();
      }
    });
  </script>
</body>
</html>
