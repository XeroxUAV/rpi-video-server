<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drone Live Camera Stream</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      padding: 10px 20px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .status-group {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      background: #21262d;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f85149;
    }
    .dot.connected { background: #3fb950; }
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    input {
      background: #0d1117;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
      width: 140px;
    }
    button {
      background: #238636;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #2ea043; }
    button.disconnect { background: #da3633; }
    button.disconnect:hover { background: #f85149; }
    #video-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      position: relative;
    }
    canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      image-rendering: auto;
    }
    .hud {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      padding: 8px 14px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 14px;
      color: #39d353;
      border: 1px solid rgba(255, 255, 255, 0.1);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="status-group">
      <div class="badge">
        <span id="status-dot" class="dot"></span>
        <span id="status-text">Disconnected</span>
      </div>
      <div class="badge">FPS: <strong id="fps-val" style="margin-left:4px; color:#58a6ff;">0</strong></div>
      <div class="badge">Res: <strong id="res-val" style="margin-left:4px; color:#58a6ff;">-</strong></div>
    </div>
    <div class="controls">
      <input type="text" id="ws-host" value="172.21.35.248" placeholder="IP Address" />
      <input type="number" id="ws-port" value="8765" placeholder="Port" style="width: 80px;" />
      <button id="btn-toggle">Connect</button>
      <button id="btn-fullscreen" style="background:#30363d;">Fullscreen</button>
    </div>
  </header>

  <div id="video-container">
    <canvas id="viewport"></canvas>
    <div class="hud" id="hud-overlay">FPS: 0.0 | Waiting for stream...</div>
  </div>

  <script>
    const canvas = document.getElementById("viewport");
    const ctx = canvas.getContext("2d");
    const statusDot = document.getElementById("status-dot");
    const statusText = document.getElementById("status-text");
    const fpsVal = document.getElementById("fps-val");
    const resVal = document.getElementById("res-val");
    const hudOverlay = document.getElementById("hud-overlay");
    const btnToggle = document.getElementById("btn-toggle");
    const btnFullscreen = document.getElementById("btn-fullscreen");
    const inputHost = document.getElementById("ws-host");
    const inputPort = document.getElementById("ws-port");

    let ws = null;
    let frameCount = 0;
    let fpsTimer = performance.now();
    let currentFps = 0.0;
    let pendingBitmap = null;
    let isRendering = false;

    // Use default IP or query param
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has("host")) inputHost.value = urlParams.get("host");
    if (urlParams.has("port")) inputPort.value = urlParams.get("port");

    function renderLoop() {
      if (pendingBitmap) {
        if (canvas.width !== pendingBitmap.width || canvas.height !== pendingBitmap.height) {
          canvas.width = pendingBitmap.width;
          canvas.height = pendingBitmap.height;
          resVal.textContent = `${pendingBitmap.width}x${pendingBitmap.height}`;
        }
        ctx.drawImage(pendingBitmap, 0, 0);
        pendingBitmap.close(); // Release GPU texture memory
        pendingBitmap = null;
      }
      requestAnimationFrame(renderLoop);
    }
    requestAnimationFrame(renderLoop);

    function connect() {
      const host = inputHost.value.trim();
      const port = inputPort.value.trim();
      const uri = `ws://${host}:${port}`;

      statusText.textContent = "Connecting...";
      statusDot.className = "dot";
      btnToggle.textContent = "Connecting...";

      try {
        ws = new WebSocket(uri);
        ws.binaryType = "blob";

        ws.onopen = () => {
          statusText.textContent = "Live";
          statusDot.className = "dot connected";
          btnToggle.textContent = "Disconnect";
          btnToggle.className = "disconnect";
        };

        ws.onmessage = async (event) => {
          frameCount++;
          const now = performance.now();
          if (now - fpsTimer >= 1000) {
            currentFps = (frameCount * 1000) / (now - fpsTimer);
            frameCount = 0;
            fpsTimer = now;
            fpsVal.textContent = currentFps.toFixed(1);
            hudOverlay.textContent = `FPS: ${currentFps.toFixed(1)} | ${canvas.width}x${canvas.height}`;
          }

          // Decode asynchronously via browser's hardware-accelerated image decoder
          try {
            const bmp = await createImageBitmap(event.data);
            if (pendingBitmap) pendingBitmap.close();
            pendingBitmap = bmp;
          } catch (err) {
            // Ignore corrupted frames
          }
        };

        ws.onclose = () => {
          statusText.textContent = "Disconnected";
          statusDot.className = "dot";
          btnToggle.textContent = "Connect";
          btnToggle.className = "";
          ws = null;
        };

        ws.onerror = () => {
          if (ws) ws.close();
        };
      } catch (e) {
        statusText.textContent = "Error";
      }
    }

    function disconnect() {
      if (ws) {
        ws.close();
        ws = null;
      }
    }

    btnToggle.addEventListener("click", () => {
      if (ws) disconnect();
      else connect();
    });

    btnFullscreen.addEventListener("click", () => {
      if (!document.fullscreenElement) {
        document.getElementById("video-container").requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    });

    // Auto-connect on load
    window.addEventListener("load", () => {
      connect();
    });
  </script>
</body>
</html>
